<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Controle de Sucata</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A121E;--hdr:#070D16;--card:#121D2D;--field:#141F31;--ink:#E8EDF3;--muted:#93A0B2;--line:#26374D;--accent:#F2A900;--accent-ink:#1A1300;--primary:#3B7BD0;--primary-hover:#4A88DB;--bad:#F27B7B;--bad-bg:#2D1717;color-scheme:dark}
@media (prefers-color-scheme: light){:root{--bg:#EDF0F3;--hdr:#0E1A2B;--card:#FFFFFF;--field:#FFFFFF;--ink:#0E1A2B;--muted:#586577;--line:#D3D9E1;--primary:#16355F;--primary-hover:#1E4478;--bad:#C62F2F;--bad-bg:#FBE8E8;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;display:flex;flex-direction:column}

/* Cabeçalho centralizado: marca + nome do sistema */
header{background:var(--hdr);border-bottom:3px solid var(--accent);height:65px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 16px}
.mark{width:40px;height:40px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 20px 'Barlow Condensed',sans-serif;flex:none}
header h1{margin:0;font:700 24px 'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase;color:#F2F5F9}

/* Cartão central com filete superior */
main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:48px 16px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:14px;padding:28px 24px 28px;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.card .mark{width:52px;height:52px;border-radius:10px;font-size:26px;margin:0 auto 14px}
.card h2{margin:0;text-align:center;font:700 28px 'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase}
.sub{margin:6px 0 22px;text-align:center;color:var(--muted);font-size:14px}

form{display:grid;gap:0}
label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}
.field{margin-bottom:16px}
input{width:100%;height:46px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:0 14px;font:inherit;font-size:16px;outline:none}
input::placeholder{color:var(--muted);opacity:.7}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 30%,transparent)}
button{width:100%;height:46px;margin-top:4px;border:0;border-radius:10px;background:var(--primary);color:#fff;font:700 16px Barlow,sans-serif;cursor:pointer}
button:hover{background:var(--primary-hover)}
button:disabled{opacity:.6;cursor:default}
.err{display:none;border:1px solid var(--bad);background:var(--bad-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:16px}

@media (max-width:480px){main{padding-top:24px}header h1{font-size:21px}}
</style>
</head>
<body>
<header>
  <div class="mark" aria-hidden="true">SC</div>
  <h1>Controle de Sucata</h1>
</header>
<main>
  <section class="card" aria-labelledby="titulo">
    <div class="mark" aria-hidden="true">SC</div>
    <h2 id="titulo">Acesso ao sistema</h2>
    <p class="sub">Pesagem, MTR e NF de Sucata</p>
    <form id="f">
      <div class="err" id="err" role="alert"></div>
      <div class="field">
        <label for="login">Login</label>
        <input id="login" name="login" placeholder="Digite seu usuário" autocomplete="username" autocapitalize="none" required autofocus>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
      </div>
      <button type="submit" id="btn">Entrar</button>
    </form>
  </section>
</main>
<script src="/login.js"></script>
</body>
</html>
